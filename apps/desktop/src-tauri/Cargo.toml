[package]
name = "asset-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "asset-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.13.1"
asset-core = { path = "../../../crates/core" }
asset-scheduler = { path = "../../../crates/scheduler" }
asset-providers = { path = "../../../crates/providers" }
asset-image-pipeline = { path = "../../../crates/image-pipeline" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
url = "2"
semver = "=1.0.28"
base64 = "=0.22.1"
futures-util = "=0.3.34"
minisign-verify = "=0.2.5"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "=1.1.10"
tar = "=0.4.46"
