[package]
name = "asset-providers"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "Truthful local provider capability gates for asset generation"

[features]
default = []
test-provider = []

[dependencies]
asset-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
flate2 = "=1.1.10"
tar = "=0.4.46"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "runtime-contract"
path = "../../tests/provider/runtime-contract.rs"
