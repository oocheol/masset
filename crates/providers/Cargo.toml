[package]
name = "asset-providers"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "Truthful local provider capability gates for asset generation"

[features]
default = []
test-provider = []

[dependencies]
asset-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"

[[test]]
name = "runtime-contract"
path = "../../tests/provider/runtime-contract.rs"
