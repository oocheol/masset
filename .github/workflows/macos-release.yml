name: Verified macOS packages

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Notarized Developer ID release, or an explicit ad-hoc trial (Gatekeeper warning remains)'
        type: choice
        options:
          - trial
          - notarized
        default: trial

permissions:
  contents: read

concurrency:
  group: macos-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Verified ${{ matrix.architecture }} ${{ inputs.distribution }} DMG
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Require Developer ID and Apple notarization credentials
        if: inputs.distribution == 'notarized'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/macos-signing.mjs check
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
          components: rust-docs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-on-failure: true
          shared-key: verified-release-${{ matrix.target }}-v2
      - run: npm ci
      - name: Native Rust tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "output/macos/${TARGET}"
          cargo test --workspace --target "${TARGET}" 2>&1 | tee "output/macos/${TARGET}/rust-tests.log"
      - name: Preserve platform license originals
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collect-third-party-notices.mjs --target "${TARGET}" --out docs/licenses --strict | tee "output/macos/${TARGET}/license-collection.json"
      - name: Build application and DMG
        shell: bash
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MACOS_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MACOS_UPDATER_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ inputs.distribution == 'notarized' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.distribution == 'notarized' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.distribution == 'notarized' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.distribution == 'notarized' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.distribution == 'notarized' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.distribution == 'notarized' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY}" || { echo 'Register MACOS_UPDATER_PRIVATE_KEY and MACOS_UPDATER_KEY_PASSWORD first.'; exit 1; }
          CONFIG="${GITHUB_WORKSPACE}/apps/desktop/src-tauri/tauri.macos.notarized.conf.json"
          if [[ "${DISTRIBUTION}" == trial ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            CONFIG="${GITHUB_WORKSPACE}/apps/desktop/src-tauri/tauri.macos.trial.conf.json"
          fi
          npm run desktop:build -- --target "${TARGET}" --config "${CONFIG}" --bundles app,dmg 2>&1 | tee "output/macos/${TARGET}/build.log"
          cargo build -p asset-desktop --release --target "${TARGET}" --bin asset-cli
      - name: Package and verify the signed Mac update archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVES=("target/${TARGET}/release/bundle/macos/"*.app.tar.gz)
          test "${#ARCHIVES[@]}" -eq 1
          node scripts/package-macos-update.mjs "${ARCHIVES[0]}" "output/macos/${TARGET}/release"
          cargo run -p asset-desktop --release --target "${TARGET}" --features native-proof --bin update-proof -- "output/macos/${TARGET}/release/"*.app.tar.gz "output/macos/${TARGET}/release/latest-macos.json" "output/macos/${TARGET}/signature-proof"
      - name: Notarize and staple the final signed DMG
        if: inputs.distribution == 'notarized'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG_FILES=("target/${TARGET}/release/bundle/dmg/"*.dmg)
          test "${#DMG_FILES[@]}" -eq 1
          node scripts/macos-signing.mjs notarize "${DMG_FILES[0]}" "output/macos/${TARGET}/notarization"
      - name: Verify actual DMG, copied native app and backend outputs
        shell: bash
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG_FILES=("target/${TARGET}/release/bundle/dmg/"*.dmg)
          test "${#DMG_FILES[@]}" -eq 1
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8')).version")"
          TRUST_ARGS=()
          if [[ "${DISTRIBUTION}" == notarized ]]; then
            TRUST_ARGS=(--require-notarization --expected-team-id "${APPLE_TEAM_ID}")
          fi
          bash scripts/verify-macos.sh "${DMG_FILES[0]}" "target/${TARGET}/release/asset-cli" "output/macos/${TARGET}/verification" --target "${TARGET}" --expected-version "${VERSION}" "${TRUST_ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.architecture }}-evidence
          path: |
            output/macos/${{ matrix.target }}/**
            docs/licenses/dependency-inventory.json
            docs/licenses/license-text-index.json
            docs/licenses/missing-license-texts.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}-${{ inputs.distribution }}-package
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            output/macos/${{ matrix.target }}/release/*
          if-no-files-found: error

# No login, Codex download, image generation, Blender installation, updater
# installation is performed by this job. The default trial requires no Apple
# account and uses an ad-hoc seal; browser downloads retain the Gatekeeper warning.
# The optional notarized mode requires Developer ID signing, hardened runtime,
# app/DMG notarization tickets and Gatekeeper acceptance, without a trial fallback.
# Package upload requires all checks to pass; release publication is separate.
